map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS variant of the portal (installed by install_dev.sh when POTATO_TLS=1).
# Serves TLS on 443 with the self-signed cert from gen_tls_cert.sh and
# redirects plain HTTP to HTTPS. Cert paths assume the default install root
# (/opt/potato); adjust if you override POTATO_TARGET_ROOT.

server {
    listen 80;
    listen [::]:80;
    server_name potato.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name potato.local _;

    ssl_certificate     /opt/potato/state/tls/cert.pem;
    ssl_certificate_key /opt/potato/state/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PotatoTLS:1m;
    ssl_session_timeout 10m;

    # Do not cap uploads at nginx; the app enforces Pi-aware limits (8/16 GiB or env override).
    client_max_body_size 0;
    client_body_timeout 3600;

    location / {
        proxy_pass http://127.0.0.1:1983;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
